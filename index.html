<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So Majestic Studios - AI Audio Mastering</title>
    <style>
        :root {
            --bg-color: #0d0d0f;
            --panel-bg: #16161a;
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #27272a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: var(--accent); font-size: 1.5rem; text-align: center; }
        p { color: var(--text-muted); font-size: 0.95rem; text-align: center; margin-bottom: 24px; }
        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-box:hover { border-color: var(--accent); background: rgba(0,255,136,0.03); }
        input[type="file"] { display: none; }
        .file-label { font-weight: 600; color: var(--text-main); cursor: pointer; display: block; }
        .settings-group { margin: 20px 0; text-align: left; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
        }
        button.primary-btn {
            width: 100%;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button.primary-btn:hover { background: var(--accent-hover); }
        #terminal {
            margin-top: 20px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent);
            text-align: left;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>So Majestic Studios</h2>
        <p>AI-Powered Professional Audio Mastering</p>

        <div class="upload-box" onclick="document.getElementById('audioFile').click()">
            <span class="file-label" id="fileLabel">📁 Tap to Upload Track (WAV / MP3)</span>
            <input type="file" id="audioFile" accept="audio/*" onchange="updateFileName()">
        </div>

        <div class="settings-group">
            <label for="preset">Mastering Target / Style</label>
            <select id="preset">
                <option value="streaming">Streaming Standard (-14 LUFS)</option>
                <option value="hiphop">Dynamic Urban / Hip-Hop (-9.5 LUFS)</option>
                <option value="club">Club Loud (-7 LUFS)</option>
            </select>
        </div>

        <button class="primary-btn" onclick="startMasteringPipeline()">Process & Master Track</button>

        <div id="terminal">System Ready. Upload a track to begin...</div>
    </div>

    <script>
        function log(message) {
            const term = document.getElementById('terminal');
            term.innerHTML += `<br>> ${message}`;
            term.scrollTop = term.scrollHeight;
        }

        function updateFileName() {
            const fileInput = document.getElementById('audioFile');
            if (fileInput.files.length > 0) {
                document.getElementById('fileLabel').innerText = "Selected: " + fileInput.files[0].name;
                log("Loaded file into memory: " + fileInput.files[0].name);
            }
        }

        async function startMasteringPipeline() {
            const fileInput = document.getElementById('audioFile');
            if (fileInput.files.length === 0) {
                alert("Please select an audio file first!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            log("Uploading raw track to Catbox free storage...");

            try {
                const response = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                });
                
                const fileUrl = await response.text();
                
                if (fileUrl.startsWith('http')) {
                    log("Upload successful!");
                    log("File URL: " + fileUrl);
                    log("Ready to connect Google Colab backend hook.");
                } else {
                    log("Upload failed. Try a smaller file format.");
                }
            } catch (error) {
                log("Error: " + error.message);
            }
        }
    </script>
</body>
</html>
