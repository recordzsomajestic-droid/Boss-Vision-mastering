    <script>
        function log(message) {
            const term = document.getElementById('terminal');
            term.innerHTML += `<br>> ${message}`;
            term.scrollTop = term.scrollHeight;
        }

        function updateFileName() {
            const fileInput = document.getElementById('audioFile');
            if (fileInput.files.length > 0) {
                document.getElementById('fileLabel').innerText = "Selected: " + fileInput.files[0].name;
                log("Loaded file into memory: " + fileInput.files[0].name);
            }
        }

        async function startMasteringPipeline() {
            const fileInput = document.getElementById('audioFile');
            if (fileInput.files.length === 0) {
                alert("Please select an audio file first!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            log("Uploading raw track via secure proxy...");

            try {
                // Using a public CORS proxy to bypass browser blocks
                const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://catbox.moe/user/api.php'), {
                    method: 'POST',
                    body: formData
                });
                
                const fileUrl = await response.text();
                
                if (fileUrl && fileUrl.startsWith('http')) {
                    log("Upload successful!");
                    log("File URL: " + fileUrl.trim());
                    log("Ready to connect Google Colab backend hook.");
                } else {
                    log("Upload failed. Response: " + fileUrl);
                }
            } catch (error) {
                log("Error: " + error.message);
            }
        }
    </script>
